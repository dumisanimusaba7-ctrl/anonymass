<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Geist; src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: GeistMono; src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #0a0a0a; color: #f3f0e8; font-family: Geist; overflow: hidden; }
  .wrap { position: relative; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { font-weight: 900; font-size: 34px; letter-spacing: -0.04em; display: flex; align-items: center; gap: 10px; }
  .logo i { display: inline-block; width: 17px; height: 32px; background: #d6ff3d; }
  h1 { font-weight: 900; text-transform: uppercase; line-height: 0.86; letter-spacing: -0.045em; font-size: 128px; }
  h1 em { font-style: normal; color: #d6ff3d; }
  .sub { font-family: GeistMono; font-size: 26px; color: #949494; letter-spacing: 0.02em; }
  .eyes { position: absolute; right: 72px; top: 64px; }
  body.game h1 { font-size: 112px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">ANONYMASS<i></i></div>
    <h1 id="title">How well<br />do you know <em>me?</em></h1>
    <p class="sub" id="sub">Create a link. Share it. Guess who clicked.</p>
  </div>
  <svg class="eyes" width="190" height="130" viewBox="0 0 64 44" aria-hidden="true">
    <ellipse cx="17" cy="22" rx="14" ry="20" fill="#d6ff3d"/>
    <ellipse cx="47" cy="22" rx="14" ry="20" fill="#d6ff3d"/>
    <ellipse cx="17" cy="22" rx="10" ry="15" fill="#f3f0e8"/>
    <ellipse cx="47" cy="22" rx="10" ry="15" fill="#f3f0e8"/>
    <circle cx="22" cy="25" r="6" fill="#0a0a0a"/>
    <circle cx="52" cy="25" r="6" fill="#0a0a0a"/>
  </svg>
  <script>
    if (location.search === '?game') {
      document.body.classList.add('game')
      document.getElementById('title').innerHTML = 'Someone is hiding<br />behind this <em>link.</em>'
      document.getElementById('sub').textContent = 'Can you figure out who they are?'
    }
    if (location.search === '?icon') {
      document.body.innerHTML = '<svg width="180" height="180" viewBox="0 0 64 64"><rect width="64" height="64" fill="#d6ff3d"/><ellipse cx="21" cy="32" rx="10.5" ry="14" fill="#0a0a0a"/><ellipse cx="43" cy="32" rx="10.5" ry="14" fill="#0a0a0a"/><ellipse cx="21" cy="32" rx="7" ry="10" fill="#f3f0e8"/><ellipse cx="43" cy="32" rx="7" ry="10" fill="#f3f0e8"/><circle cx="25" cy="34" r="4.2" fill="#0a0a0a"/><circle cx="47" cy="34" r="4.2" fill="#0a0a0a"/></svg>'
      document.body.style.cssText = 'width:180px;height:180px'
    }
  </script>
</body>
</html>
