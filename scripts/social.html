<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Saira; src: url('../node_modules/@fontsource/saira-extra-condensed/files/saira-extra-condensed-latin-700-normal.woff2'); font-weight: 700; }
  @font-face { font-family: Jost; src: url('../node_modules/@fontsource-variable/jost/files/jost-latin-wght-normal.woff2'); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #333399; color: #fff; font-family: Jost; overflow: hidden; position: relative; }
  .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand b { font-family: Saira; font-weight: 700; font-size: 44px; letter-spacing: .06em; line-height: 1; }
  .brand span { display: block; font-size: 20px; color: #c9cbe6; margin-top: 4px; }
  h1 { font-family: Saira; font-weight: 700; font-size: 104px; line-height: .98; max-width: 600px; letter-spacing: -.01em; }
  p { font-size: 26px; color: #e6e7f5; }
  .lens { position: absolute; border-radius: 50%; overflow: hidden; border: 8px solid #ccecff; background: #fff; }
  .lens img { width: 100%; height: 100%; object-fit: cover; }
  .a { width: 330px; height: 330px; right: 64px; top: 70px; }
  .b { width: 190px; height: 190px; right: 300px; top: 360px; }
  .b img { object-fit: contain; padding: 16px; }
  body.icon { width: 180px; height: 180px; }
</style>
</head>
<body>
  <div class="wrap" id="og">
    <div class="brand">
      <svg width="64" height="64" viewBox="0 0 100 100" stroke-linejoin="round" stroke-width="4">
        <path d="M15 35L38 14L55 11L55 18L29.5 43Z" fill="#fff" stroke="#fff"/>
        <path d="M65 15L86 38L89 55L82 55L57 29.5Z" fill="#ef5d22" stroke="#ef5d22"/>
        <path d="M85 65L62 86L45 89L45 82L70.5 57Z" fill="#000066" stroke="#000066"/>
        <path d="M35 85L14 62L11 45L18 45L43 70.5Z" fill="#fff000" stroke="#fff000"/>
      </svg>
      <div><b>OPTIMA</b><span>Medical Supplies · Kitwe, Zambia</span></div>
    </div>
    <h1>Ward, theatre and lab supplies</h1>
    <p>Build a quote list and send it on WhatsApp</p>
  </div>
  <div class="lens a"><img src="../src/assets/products/lab-glassware.jpg" /></div>
  <div class="lens b"><img src="../src/assets/products/monitors-ultrasound.jpg" /></div>
  <script>
    if (location.search === '?icon') {
      document.body.className = 'icon'
      document.body.innerHTML = '<svg width="180" height="180" viewBox="0 0 64 64"><rect width="64" height="64" fill="#333399"/><g transform="translate(6 6) scale(.52)" stroke-linejoin="round" stroke-width="4"><path d="M15 35L38 14L55 11L55 18L29.5 43Z" fill="#fff" stroke="#fff"/><path d="M65 15L86 38L89 55L82 55L57 29.5Z" fill="#ef5d22" stroke="#ef5d22"/><path d="M85 65L62 86L45 89L45 82L70.5 57Z" fill="#000066" stroke="#000066"/><path d="M35 85L14 62L11 45L18 45L43 70.5Z" fill="#fff000" stroke="#fff000"/></g></svg>'
    }
  </script>
</body>
</html>
