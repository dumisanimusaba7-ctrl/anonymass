<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Template for link-preview cards. scripts/social.mjs fills it in through
     query parameters and saves a 1200×630 JPEG per page into public/og/. -->
<style>
  @font-face { font-family: Saira; src: url('../node_modules/@fontsource/saira-extra-condensed/files/saira-extra-condensed-latin-700-normal.woff2'); font-weight: 700; }
  @font-face { font-family: Jost; src: url('../node_modules/@fontsource-variable/jost/files/jost-latin-wght-normal.woff2'); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #333399; color: #fff; font-family: Jost; overflow: hidden; position: relative; }
  .wrap { position: absolute; inset: 0; padding: 60px 72px 76px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand b { font-family: Saira; font-weight: 700; font-size: 44px; letter-spacing: .06em; line-height: 1; }
  .brand span { display: block; font-size: 20px; color: #c9cbe6; margin-top: 4px; }
  h1 { font-family: Saira; font-weight: 700; font-size: 96px; line-height: .98; max-width: 620px; letter-spacing: -.01em; }
  .sub { font-size: 27px; line-height: 1.3; color: #e6e7f5; max-width: 600px; margin-top: 22px; }
  .foot { font-size: 21px; color: #c9cbe6; }
  .foot b { color: #fff; font-weight: 600; }
  .lens { position: absolute; border-radius: 50%; overflow: hidden; border: 8px solid #ccecff; background: #fff; }
  .lens img { width: 100%; height: 100%; object-fit: contain; padding: 9%; }
  .lens.cover img { object-fit: cover; padding: 0; }
  .a { width: 360px; height: 360px; right: 60px; top: 64px; }
  .b { width: 200px; height: 200px; right: 330px; top: 360px; }
  .mark { position: absolute; right: 92px; top: 120px; width: 330px; height: 330px; }
  /* The red and ice-blue wave from the profile cover */
  .wave { position: absolute; left: 0; right: 0; bottom: 0; width: 1200px; height: 44px; }
  body.icon { width: 180px; height: 180px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg width="64" height="64" viewBox="0 0 100 100" stroke-linejoin="round" stroke-width="4">
        <path d="M15 35L38 14L55 11L55 18L29.5 43Z" fill="#fff" stroke="#fff"/>
        <path d="M65 15L86 38L89 55L82 55L57 29.5Z" fill="#ef5d22" stroke="#ef5d22"/>
        <path d="M85 65L62 86L45 89L45 82L70.5 57Z" fill="#000066" stroke="#000066"/>
        <path d="M35 85L14 62L11 45L18 45L43 70.5Z" fill="#fff000" stroke="#fff000"/>
      </svg>
      <div><b>OPTIMA</b><span>Medical Supplies · Kitwe, Zambia</span></div>
    </div>
    <div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <p class="foot">WhatsApp <b>+260 966 897076</b> · Plot 1051, Accra Road, Kitwe</p>
  </div>
  <div id="visual"></div>
  <svg class="wave" viewBox="0 0 1200 44" preserveAspectRatio="none">
    <path d="M0 30 C 300 6, 640 50, 1200 18 L1200 44 L0 44 Z" fill="#22226e"/>
    <path d="M0 30 C 300 6, 640 50, 1200 18" fill="none" stroke="#ccecff" stroke-width="12"/>
    <path d="M0 30 C 300 6, 640 50, 1200 18" fill="none" stroke="#ff0000" stroke-width="5"/>
  </svg>
  <script>
    const q = new URLSearchParams(location.search)
    const MARK = '<svg class="mark" viewBox="0 0 100 100" stroke-linejoin="round" stroke-width="4"><path d="M15 35L38 14L55 11L55 18L29.5 43Z" fill="#fff" stroke="#fff"/><path d="M65 15L86 38L89 55L82 55L57 29.5Z" fill="#ef5d22" stroke="#ef5d22"/><path d="M85 65L62 86L45 89L45 82L70.5 57Z" fill="#000066" stroke="#000066"/><path d="M35 85L14 62L11 45L18 45L43 70.5Z" fill="#fff000" stroke="#fff000"/></svg>'
    if (q.has('icon')) {
      document.body.className = 'icon'
      document.body.innerHTML = '<svg width="180" height="180" viewBox="0 0 64 64"><rect width="64" height="64" fill="#333399"/><g transform="translate(6 6) scale(.52)">' + MARK.replace(/<\/?svg[^>]*>/g, '') + '</g></svg>'
    } else {
      document.getElementById('title').textContent = q.get('title')
      document.getElementById('sub').textContent = q.get('sub')
      const lens = (cls, src, fit) => `<div class="lens ${cls} ${fit === 'cover' ? 'cover' : ''}"><img src="../src/assets/products/${src}"></div>`
      document.getElementById('visual').innerHTML = q.get('a')
        ? lens('a', q.get('a'), q.get('fit')) + (q.get('b') ? lens('b', q.get('b')) : '')
        : MARK
    }
  </script>
</body>
</html>
